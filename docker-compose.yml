version: "3.9"

services:
  bwvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bwvault
    # No ports exposed by default — this is a CLI container, not a server.
    # Uncomment to serve the web dashboard on http://localhost:8080
    # ports: ["8080:8080"]
    volumes:
      - bwvault-data:/data
      - ./agent-harness:/app/agent-harness:ro   # live source in dev
    environment:
      - BWVAULT_HOME=/data/session
      - NO_COLOR=
      # Supply the master password via host env for non-interactive runs.
      # WARNING: only use in trusted CI environments; prefer `--password`
      # interactive prompt or piped stdin for production.
      # - BWVAULT_PASSWORD=${BWVAULT_PASSWORD}
    security_opt:
      - no-new-privileges:true
    read_only: false
    user: "1000:1000"
    tmpfs:
      - /tmp:size=10M
    restart: "no"

volumes:
  bwvault-data:
    driver: local
